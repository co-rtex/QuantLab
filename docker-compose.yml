# Project name and host ports come from scripts/stack-env.sh (via make) so each git
# worktree gets its own containers, volumes and ports; the defaults are the main checkout.
# The core services are `restart: unless-stopped` (#162): Docker restarts one that crashes
# or is OOM-killed. `docker compose stop` / `down` still stop them, and they stay stopped.
# QUANTLAB_RESTART_POLICY overrides it. scripts/stack-env.sh sets "no" for linked worktrees,
# so their dev stacks do not all come back when Docker restarts; the main checkout and the
# edge overlay (infra/edge/compose.yml) keep unless-stopped.
name: ${COMPOSE_PROJECT_NAME:-quantlab}

x-app-env: &app-env
  QUANTLAB_DATABASE_URL: postgresql+psycopg://quantlab:quantlab@postgres:5432/quantlab
  # Redis requires AUTH (#115). The default is for local development only; production
  # refuses a Redis URL without a real password (config.py).
  QUANTLAB_REDIS_URL: redis://:${QUANTLAB_REDIS_PASSWORD:-quantlab-dev}@redis:6379/0
  QUANTLAB_DATA_DIR: /data
  QUANTLAB_ENVIRONMENT: ${QUANTLAB_ENVIRONMENT:-development}
  QUANTLAB_JWT_SECRET: ${QUANTLAB_JWT_SECRET:-dev-only-insecure-secret-change-me-0123456789}
  QUANTLAB_ANTHROPIC_API_KEY: ${QUANTLAB_ANTHROPIC_API_KEY:-}
  QUANTLAB_GIT_SHA: ${QUANTLAB_GIT_SHA:-unknown}
  QUANTLAB_OTEL_ENDPOINT: ${QUANTLAB_OTEL_ENDPOINT:-}
  QUANTLAB_METRICS_TOKEN: ${QUANTLAB_METRICS_TOKEN:-}
  # Only the web tier may state the client address (X-Forwarded-For); see ADR-0008.
  QUANTLAB_TRUSTED_PROXIES: ${QUANTLAB_TRUSTED_PROXIES:-["web"]}

services:
  postgres:
    image: postgres:17-alpine
    restart: ${QUANTLAB_RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_USER: quantlab
      POSTGRES_PASSWORD: quantlab
      POSTGRES_DB: quantlab
    ports: ["127.0.0.1:${QUANTLAB_PG_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantlab"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: ${QUANTLAB_RESTART_POLICY:-unless-stopped}
    # The password comes from the environment at start, never from the image (#115).
    environment:
      REDIS_PASSWORD: ${QUANTLAB_REDIS_PASSWORD:-quantlab-dev}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:${QUANTLAB_REDIS_PORT:-6380}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      # REDISCLI_AUTH keeps the password out of the probe's command line.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    restart: ${QUANTLAB_RESTART_POLICY:-unless-stopped}
    environment:
      <<: *app-env
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    command: ["sh", "-c", "alembic -c services/api/alembic.ini upgrade head && rm -rf \"$$PROMETHEUS_MULTIPROC_DIR\" && mkdir -p \"$$PROMETHEUS_MULTIPROC_DIR\" && uvicorn quantlab_api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --workers ${QUANTLAB_API_WORKERS:-4}"]
    ports: ["127.0.0.1:${QUANTLAB_API_PORT:-8000}:8000"]
    volumes: [appdata:/data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["app"]

  worker:
    build: { context: ., dockerfile: services/api/Dockerfile }
    restart: ${QUANTLAB_RESTART_POLICY:-unless-stopped}
    environment: *app-env
    command: ["quantlab-worker"]
    volumes: [appdata:/data]
    depends_on:
      api: { condition: service_healthy }
    deploy:
      replicas: ${QUANTLAB_WORKERS:-2}
      resources:
        limits: { cpus: "1.0", memory: 1536M }
    profiles: ["app"]

  reaper:
    build: { context: ., dockerfile: services/api/Dockerfile }
    restart: ${QUANTLAB_RESTART_POLICY:-unless-stopped}
    environment: *app-env
    command: ["quantlab-cli", "reaper", "--interval", "15"]
    # The reaper sweeps uploads, orphaned versions and the trash in the data directory, so
    # it must see the same volume as the API and workers (it ran against an empty /data).
    volumes: [appdata:/data]
    depends_on:
      api: { condition: service_healthy }
    profiles: ["app"]

  web:
    build: { context: apps/web, dockerfile: Dockerfile }
    restart: ${QUANTLAB_RESTART_POLICY:-unless-stopped}
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:${QUANTLAB_WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }
    profiles: ["app"]

  # --- optional observability stack: docker compose --profile observability up -d ------------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:${QUANTLAB_JAEGER_PORT:-16686}:16686", "127.0.0.1:${QUANTLAB_OTLP_PORT:-4318}:4318"]
    profiles: ["observability"]

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/metrics_token:/etc/prometheus/metrics_token:ro
    ports: ["127.0.0.1:${QUANTLAB_PROMETHEUS_PORT:-9090}:9090"]
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${QUANTLAB_GRAFANA_PORT:-3001}:3000"]
    profiles: ["observability"]

volumes:
  pgdata:
  redisdata:
  appdata:
