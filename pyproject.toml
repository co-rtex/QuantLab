[project]
name = "quantlab-workspace"
version = "0.1.0"
description = "QuantLab monorepo workspace root"
requires-python = ">=3.12,<3.14"
dependencies = ["quantlab", "quantlab-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/quantlab", "services/api"]

[tool.uv.sources]
quantlab = { workspace = true }
quantlab-api = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-cov>=6.0",
  "hypothesis>=6.150",
  "ruff>=0.17",
  "mypy>=2.0",
  "fakeredis>=2.30",
  "types-redis",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/quantlab/src", "services/api/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N", "PT"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "N803", "N806", "N818", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "PT011", "PT018", "RUF012", "E501"]
"benchmarks/**" = ["S"]
"services/api/alembic/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
markers = [
  "integration: requires PostgreSQL (QUANTLAB_DATABASE_URL)",
  "slow: long-running tests",
]
filterwarnings = ["error::FutureWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/quantlab/src", "services/api/src"]
packages = ["quantlab", "quantlab_api"]
disable_error_code = ["no-any-return"]

[tool.coverage.run]
source = ["quantlab", "quantlab_api"]
branch = true
