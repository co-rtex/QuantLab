global:
  scrape_interval: 15s
scrape_configs:
  - job_name: quantlab-api
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:8000"]
  # Job, dataset, cache and ingest metrics are recorded in the workers (#165). Each replica
  # serves its own at :9101 (never published); the compose name `worker` resolves to every
  # replica, so one target per worker follows the replica count.
  - job_name: quantlab-worker
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/metrics_token
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9101
        refresh_interval: 30s
  # The reaper's lease-loss retries and the outcomes it decides (#179), at :9102 (never
  # published). By name, like the workers, so a stopped reaper is no target, not an error.
  - job_name: quantlab-reaper
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/metrics_token
    dns_sd_configs:
      - names: ["reaper"]
        type: A
        port: 9102
        refresh_interval: 30s
