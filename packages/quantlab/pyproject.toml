[project]
name = "quantlab"
version = "0.1.0"
description = "QuantLab quantitative research domain library: data, accounting, backtesting, analytics, research validation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.2",
  "pandas>=2.2",
  "scipy>=1.14",
  "pyarrow>=18",
  "pydantic>=2.10",
  "scikit-learn>=1.6",
  "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]
