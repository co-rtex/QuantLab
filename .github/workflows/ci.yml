name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    # The suite takes about 10 min with coverage (1500 tests); runners have run it 2x slower
    # on 2026-11-01 (runs cancelled at 20 min on unrelated PRs), so 30 leaves headroom.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quantlab
          POSTGRES_PASSWORD: quantlab
          POSTGRES_DB: quantlab
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U quantlab" --health-interval 2s --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml -q
      # Runtime dependencies block the build; dev tools only warn. Accepted findings are
      # passed as --ignore-vuln <ID> and recorded in docs/SECURITY_DEPENDENCIES.md (#137).
      - name: Dependency audit (runtime, blocking)
        run: uvx pip-audit==2.10.1 --strict --progress-spinner off --no-deps --disable-pip -r <(uv export --frozen --all-packages --no-dev --no-hashes --no-emit-workspace)
        shell: bash
      - name: Dependency audit (dev tools, report only)
        run: uvx pip-audit==2.10.1 --progress-spinner off --no-deps --disable-pip -r <(uv export --frozen --all-packages --all-groups --no-hashes --no-emit-workspace) || echo "::warning::pip-audit reported findings in dev tools"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests for the proxy and edge helpers (src/**/*.test.mts; Node's built-in runner).
      - run: npm test
      - run: npm run build
      - name: npm audit (runtime, blocking)
        run: npm audit --omit=dev --audit-level=low
      - name: npm audit (dev tools, report only)
        run: npm audit || echo "::warning::npm audit reported findings in dev tools (see docs/SECURITY_DEPENDENCIES.md)"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f services/api/Dockerfile -t quantlab-api:ci .
