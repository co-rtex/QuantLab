[project]
name = "quantlab-api"
version = "0.1.0"
description = "QuantLab HTTP API and background workers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "quantlab",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  # 3.0.x only: QuantlabWorker (worker.py) overrides rq.Worker internals, heartbeat,
  # maintain_heartbeats, run_maintenance_tasks, check_for_suspension, set_state,
  # register_death, fork_work_horse and execute_job (#165, #185), and relies on
  # monitor_work_horse resetting _horse_pid and on the work loop's error handling;
  # TrustedJob (jobs.py, #115) overrides Job.func and the callback properties. Re-check
  # those, with tests/unit/test_worker_redis_outage.py, test_worker_metrics.py and
  # test_rq_trusted.py, before raising the bound.
  "rq>=3.0,<3.1",
  "duckdb>=1.1",
  "pyjwt>=2.10",
  "pwdlib[argon2]>=0.2",
  # Below 0.27: the worker's metrics (observability.py, #165) rely on internals,
  # prometheus_client.mmap_dict.MmapedDict (its file format and read_all_values_from_file)
  # and MultiProcessCollector._path, merge() and the *.db file naming. Re-check before
  # raising the bound (tests/unit/test_worker_metrics.py).
  "prometheus-client>=0.21,<0.27",
  "structlog>=24.4",
  "httpx>=0.28",
  "email-validator>=2.2",
  "python-multipart>=0.0.20",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
quantlab-worker = "quantlab_api.worker:main"
quantlab-cli = "quantlab_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab_api"]

[tool.uv.sources]
quantlab = { workspace = true }
