[project]
name = "quantlab-api"
version = "0.1.0"
description = "QuantLab HTTP API and background workers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "quantlab",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "rq>=2.0",
  "duckdb>=1.1",
  "pyjwt>=2.10",
  "pwdlib[argon2]>=0.2",
  "prometheus-client>=0.21",
  "structlog>=24.4",
  "httpx>=0.28",
  "email-validator>=2.2",
  "python-multipart>=0.0.20",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
quantlab-worker = "quantlab_api.worker:main"
quantlab-cli = "quantlab_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab_api"]

[tool.uv.sources]
quantlab = { workspace = true }
